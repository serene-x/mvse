name: mvse
description: Beauty discovery, shade matching and a personal product diary.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  url_launcher: ^6.3.0
  http: ^1.2.0

dev_dependencies:
  shared_preferences: ^2.5.3
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/
    - assets/products/
  fonts:
    - family: MvseSerif
      fonts:
        - asset: assets/fonts/LibreCaslonDisplay-Regular.ttf
